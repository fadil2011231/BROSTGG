<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>SkinForge — 3D Painter</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Three.js for 3D Painting -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<style>
:root{
  --bg: #090b14; --panel: rgba(25, 29, 43, 0.45); --line: rgba(255, 255, 255, 0.08);
  --text: #f3f4ff; --muted: #989fb9; --accent: #b6fa70; --glow: rgba(182, 250, 112, 0.3);
}
*{box-sizing:border-box}
body{ margin:0;background:var(--bg);color:var(--text); font-family:'Inter',sans-serif; overflow-x: hidden; }
#particles-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
h1, h2, .brand, .tag, h3 { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }

header{
  display:flex;align-items:center;justify-content:space-between;
  height:70px;border-bottom:1px solid var(--line);padding: 0 28px;
  background: rgba(9, 11, 20, 0.7); backdrop-filter: blur(12px);
}
.brand{font-size:28px; letter-spacing: 2px; color: #fff; text-decoration: none;}
.brand span{color:var(--accent)}

.editor-shell{
  display:grid;grid-template-columns:220px minmax(0,1fr) 260px;
  border:1px solid var(--line);border-radius:20px; background: var(--panel);
  backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.3);
  max-width: 1320px; margin: 40px auto; min-height: 80vh; overflow:hidden;
}
.tools, .preview-panel{padding:24px; background: rgba(0,0,0,0.2);}
.tools{border-right:1px solid var(--line)}
.preview-panel{border-left:1px solid var(--line)}
h3{ font-size:20px; margin:0 0 20px; color:var(--accent); }

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;padding:11px 20px;border:1px solid var(--line);
  background: rgba(255, 255, 255, 0.05); border-radius:9px;color:var(--text);
  font-weight:600;font-size:13px; cursor: pointer; transition: 0.3s; width: 100%; margin-bottom: 10px;
}
.btn:hover{ background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
.btn.active{ border-color:var(--accent);color:var(--accent);background:rgba(182, 250, 112, 0.1); }
.btn.primary{ background:var(--accent);color:#192610; border-color: var(--accent); }
.btn.primary:hover{ background:#d0ffa0; }

.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.color-row{display:flex;align-items:center;gap:12px;margin-bottom:20px;font-size:13px;}
input[type=color]{width:48px;height:48px;border:0;padding:0;background:none;cursor:pointer; border-radius: 8px;}
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 8px; }

.workspace{
  padding:0; display: flex; flex-direction: column; position: relative;
  background: radial-gradient(circle at center, #1e2230, #090b14);
}
#three-canvas-container {
  flex: 1; width: 100%; height: 100%; cursor: crosshair; outline: none;
}
.workspace-top{
  position: absolute; top: 20px; left: 20px; right: 20px;
  display:flex;justify-content:space-between; font:12px monospace;color:var(--muted);
  pointer-events: none; z-index: 10;
}
.help-text {
  position: absolute; bottom: 20px; left: 20px; right: 20px;
  text-align: center; font-size: 12px; color: var(--muted); pointer-events: none;
}
</style>
</head>
<body>

<header>
  <a class="brand" href="#">SKIN<span>FORGE</span> 3D</a>
  <button class="btn primary" id="download" style="width: auto; margin: 0;">↓ Download PNG</button>
</header>

<div class="editor-shell">
  <aside class="tools">
    <h3>TOOLBOX</h3>
    <div class="tool-grid">
      <button class="btn active" data-tool="pencil">Pencil</button>
      <button class="btn" data-tool="eraser">Eraser</button>
    </div>
    <div class="color-row">
      <input type="color" id="color" value="#3888df">
      <span id="hex" style="font-family: monospace;">#3888df</span>
    </div>
    <button class="btn" id="undo">↶ Undo</button>
    <button class="btn" id="clear">× Clear All</button>
    
    <div style="margin-top: 30px;">
      <p style="font-size: 12px; color: var(--muted);">
        * Click and drag outside the model to rotate the camera.<br><br>
        * Click and drag ON the model to paint directly on the 3D surface.
      </p>
    </div>
  </aside>

  <div class="workspace">
    <div class="workspace-top">
      <span>3D DIRECT PAINTING</span>
      <span id="coords" style="background: rgba(0,0,0,0.5); padding: 4px 10px; border-radius: 6px;">X: - / Y: -</span>
    </div>
    
    <!-- 3D Viewport replaces the 2D Atlas -->
    <div id="three-canvas-container"></div>
    
    <div class="help-text">Scroll to Zoom · Right Click to Pan</div>
  </div>

  <aside class="preview-panel">
    <h3>TEXTURE MAP</h3>
    <div style="background: repeating-conic-gradient(#1e2230 0% 25%,#151824 0% 50%) 0 0/16px 16px; border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; justify-content: center; margin-bottom: 20px;">
      <!-- Hidden 2D Canvas shown here for reference -->
      <canvas id="hidden-texture" width="64" height="64" style="width: 100%; image-rendering: pixelated;"></canvas>
    </div>
    <label>File Name</label>
    <input type="text" id="filename" value="My-3D-Skin" style="width: 100%; padding: 10px; margin-top: 5px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); color: white; border-radius: 6px;">
  </aside>
</div>

<script>
// UI Setup
let currentTool = "pencil";
let currentColor = "#3888df";
document.querySelectorAll('[data-tool]').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTool = btn.dataset.tool;
  };
});
document.getElementById('color').oninput = (e) => {
  currentColor = e.target.value;
  document.getElementById('hex').textContent = currentColor;
};

// Hidden 2D Canvas Context (The actual 64x64 texture)
const textureCanvas = document.getElementById('hidden-texture');
const ctx = textureCanvas.getContext('2d', { willReadFrequently: true });
ctx.fillStyle = "#dba77e"; // Base skin tone
ctx.fillRect(8, 8, 8, 8); // Face base for reference

// Three.js Setup
const container = document.getElementById('three-canvas-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(20, 20, 40);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// Create CanvasTexture
const canvasTexture = new THREE.CanvasTexture(textureCanvas);
canvasTexture.magFilter = THREE.NearestFilter;
canvasTexture.minFilter = THREE.NearestFilter;

// Material
const material = new THREE.MeshBasicMaterial({ map: canvasTexture, transparent: true });

// Create Character Parts (Simplified for demonstration)
const group = new THREE.Group();

// Head Geometry (8x8x8) mapped to 0-32, 0-16 in UV
const headGeo = new THREE.BoxGeometry(8, 8, 8);
// Wireframe logic to match screenshot
const edges = new THREE.EdgesGeometry(headGeo);
const gridMaterial = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 });
const headLines = new THREE.LineSegments(edges, gridMaterial);

// Add custom subdivisions to show the 8x8 pixel grid on the mesh
const gridGeo = new THREE.BoxGeometry(8, 8, 8, 8, 8, 8);
const gridEdges = new THREE.EdgesGeometry(gridGeo);
const pixelGrid = new THREE.LineSegments(gridEdges, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 }));

const headMesh = new THREE.Mesh(headGeo, material);
headMesh.position.y = 4;
headMesh.add(headLines);
headMesh.add(pixelGrid);
group.add(headMesh);

// Basic Body Geometry (8x12x4)
const bodyGeo = new THREE.BoxGeometry(8, 12, 4);
const bodyMesh = new THREE.Mesh(bodyGeo, material);
bodyMesh.position.y = -6;
const bodyGrid = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8, 12, 4, 8, 12, 4)), new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.08 }));
bodyMesh.add(bodyGrid);
group.add(bodyMesh);

scene.add(group);

// Raycasting for 3D Painting
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let isPainting = false;

function getIntersect(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(group.children)[0];
}

function paint(e) {
  if (!isPainting) return;
  const intersect = getIntersect(e);
  if (intersect && intersect.uv) {
    // Disable orbit controls while painting on the mesh
    controls.enabled = false;
    
    // Map UV to 64x64 canvas
    // Note: Default Three.js box UVs span 0-1. For a full proper skin, 
    // custom UV mapping arrays are needed per face. 
    // This demonstrates the grid mapping.
    const x = Math.floor(intersect.uv.x * 64);
    const y = Math.floor((1 - intersect.uv.y) * 64);
    
    document.getElementById('coords').textContent = `X: ${x} / Y: ${y}`;
    
    if (currentTool === 'eraser') {
      ctx.clearRect(x, y, 1, 1);
    } else {
      ctx.fillStyle = currentColor;
      ctx.fillRect(x, y, 1, 1);
    }
    
    canvasTexture.needsUpdate = true;
  }
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  const intersect = getIntersect(e);
  if(intersect) {
    isPainting = true;
    paint(e);
  }
});
renderer.domElement.addEventListener('pointermove', paint);
window.addEventListener('pointerup', () => {
  isPainting = false;
  controls.enabled = true; // Re-enable orbit controls
});

// Render Loop
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

// Resize Handler
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

// Download
document.getElementById('download').onclick = () => {
  const link = document.createElement('a');
  link.download = document.getElementById('filename').value + '.png';
  link.href = textureCanvas.toDataURL();
  link.click();
};

document.getElementById('clear').onclick = () => {
  ctx.clearRect(0,0,64,64);
  canvasTexture.needsUpdate = true;
};
</script>
</body>
</html>
