<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b14">

<title>SkinForge — Pro 3D Skin Studio</title>

<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundle.js"></script>

<style>
:root{
  --bg:#090b14;
  --panel:rgba(25,29,43,.45);
  --line:rgba(255,255,255,.08);
  --text:#f3f4ff;
  --muted:#989fb9;
  --accent:#b6fa70;
  --glow:rgba(182,250,112,.3);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  overflow-x:hidden;
}

#particles-bg{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:-2;
  pointer-events:none;
}

.orb{
  position:fixed;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
  opacity:.3;
  pointer-events:none;
}

.orb-1{
  width:400px;
  height:400px;
  background:var(--accent);
  top:-10%;
  left:-10%;
}

.orb-2{
  width:500px;
  height:500px;
  background:#3888df;
  bottom:-20%;
  right:-10%;
}

button,
input{
  font:inherit;
  outline:none;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

.wrap{
  max-width:1320px;
  margin:auto;
  padding:0 28px;
  position:relative;
}

h1,
h2,
.brand,
.tag{
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:1px;
}

header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  height:86px;
  border-bottom:1px solid var(--line);
  background:rgba(9,11,20,.7);
  backdrop-filter:blur(12px);
  position:sticky;
  top:0;
  z-index:100;
}

.brand{
  font-size:32px;
  letter-spacing:2px;
}

.brand span{
  color:var(--accent);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:11px 20px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.05);
  backdrop-filter:blur(4px);
  border-radius:9px;
  color:var(--text);
  font-weight:600;
  font-size:13px;
  transition:all .3s;
}

.btn:hover:not(:disabled){
  background:rgba(255,255,255,.1);
  transform:translateY(-2px);
  border-color:rgba(255,255,255,.2);
}

.btn.primary{
  background:var(--accent);
  color:#192610;
  border-color:var(--accent);
  box-shadow:0 8px 20px var(--glow);
}

.btn.primary:hover{
  background:#d0ffa0;
}

section{
  padding:50px 0;
}

.heading{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  margin-bottom:30px;
}

h2{
  font-size:42px;
  margin:5px 0;
  font-weight:400;
}

.sub{
  font-size:14px;
  color:var(--muted);
  line-height:1.6;
}

.fetch-bar{
  display:flex;
  gap:15px;
  background:rgba(0,0,0,.3);
  padding:20px;
  border-radius:12px;
  border:1px solid var(--line);
  backdrop-filter:blur(10px);
  max-width:600px;
  margin-bottom:20px;
}

.fetch-bar input{
  flex:1;
  padding:12px 18px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  border-radius:8px;
  color:#fff;
  font-size:15px;
}

.fetch-bar input:focus{
  border-color:var(--accent);
}

.presets{
  margin-bottom:40px;
  max-width:600px;
}

.presets h4{
  margin:0 0 12px;
  color:var(--muted);
  font-size:14px;
  font-family:'Bebas Neue',sans-serif;
  letter-spacing:1px;
}

.preset-grid{
  display:flex;
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}

.preset-grid img{
  width:44px;
  height:44px;
  border-radius:8px;
  cursor:pointer;
  border:2px solid transparent;
  transition:.2s;
  background:rgba(0,0,0,.3);
}

.preset-grid img:hover{
  border-color:var(--accent);
  transform:scale(1.1);
}

.editor-shell{
  display:grid;
  grid-template-columns:220px minmax(0,1fr) 260px;
  border:1px solid var(--line);
  border-radius:20px;
  background:var(--panel);
  backdrop-filter:blur(20px);
  box-shadow:0 25px 50px rgba(0,0,0,.3);
  overflow:hidden;
}

.tools,
.preview-panel{
  padding:24px;
  background:rgba(0,0,0,.2);
}

.tools{
  border-right:1px solid var(--line);
}

.tools h3,
.preview-panel h3{
  font-family:'Bebas Neue',sans-serif;
  font-size:20px;
  margin:0 0 20px;
  color:var(--accent);
  letter-spacing:1px;
}

.tool-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:24px;
}

.tool-grid .btn{
  padding:12px 4px;
  font-size:12px;
}

.tool-grid .active{
  border-color:var(--accent);
  color:var(--accent);
  background:rgba(182,250,112,.1);
  box-shadow:inset 0 0 10px rgba(182,250,112,.1);
}

.color-row{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  font-size:13px;
  font-weight:500;
}

input[type=color]{
  width:48px;
  height:48px;
  border:0;
  padding:0;
  background:none;
  cursor:pointer;
  border-radius:8px;
}

input[type=color]::-webkit-color-swatch-wrapper{
  padding:0;
}

input[type=color]::-webkit-color-swatch{
  border:1px solid var(--line);
  border-radius:8px;
}

.swatches{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-bottom:24px;
}

.swatch{
  height:28px;
  border:1px solid rgba(255,255,255,.15);
  border-radius:6px;
  cursor:pointer;
  transition:transform .2s;
}

.swatch:hover{
  transform:scale(1.1);
}

.tools>.btn{
  width:100%;
  margin-bottom:12px;
}

.check{
  display:flex;
  gap:10px;
  align-items:center;
  font-size:13px;
  color:var(--muted);
  margin:20px 0;
  cursor:pointer;
}

.workspace{
  padding:24px;
  min-width:0;
  display:flex;
  flex-direction:column;
}

.workspace-top{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font:12px monospace;
  color:var(--muted);
  margin-bottom:20px;
}

.preview-stage{
  display:flex;
  justify-content:center;
  align-items:center;
  flex:1;
  min-height:450px;
  border-radius:12px;
  background:radial-gradient(
    circle at center,
    rgba(182,250,112,.05),
    rgba(0,0,0,.6) 80%
  );
  border:1px solid var(--line);
  box-shadow:inset 0 0 30px rgba(0,0,0,.7);
  position:relative;
  overflow:hidden;
}

#skin-container canvas{
  outline:none;
  cursor:crosshair;
  touch-action:none;
  user-select:none;
}

.controls-hint{
  font-size:12px;
  color:var(--accent);
  margin:15px 0 10px;
  text-align:center;
}

.preview-panel{
  border-left:1px solid var(--line);
}

.atlas-wrap{
  width:100%;
  max-width:256px;
  margin:auto;
  background:repeating-conic-gradient(
    #1e2230 0% 25%,
    #151824 0% 50%
  ) 0 0/8px 8px;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  overflow:hidden;
}

#atlas{
  width:100%;
  display:block;
  image-rendering:pixelated;
  touch-action:none;
  cursor:crosshair;
}

.toggle{
  display:flex;
  gap:10px;
  margin:15px auto 0;
  max-width:300px;
  justify-content:center;
}

.toggle .btn{
  flex:1;
  padding:10px;
  font-size:13px;
}

.preview-panel input[type=text]{
  width:100%;
  margin:20px 0 16px;
  padding:12px;
  background:rgba(0,0,0,.3);
  border:1px solid var(--line);
  color:white;
  border-radius:8px;
}

.preview-panel>.btn{
  width:100%;
  margin-top:6px;
}

#notice{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:var(--accent);
  color:#17230e;
  padding:14px 28px;
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  z-index:1000;
  max-width:90vw;
  font-size:14px;
  font-weight:700;
  transition:opacity .3s,transform .3s;
}

#notice:empty{
  opacity:0;
  transform:translate(-50%,20px);
  pointer-events:none;
}

@media(max-width:1050px){
  .editor-shell{
    grid-template-columns:180px minmax(0,1fr);
  }
  .preview-panel{
    grid-column:1/-1;
    border-left:0;
    border-top:1px solid var(--line);
  }
}

@media(max-width:768px){
  .wrap{
    padding:0 20px;
  }
  .fetch-bar{
    flex-direction:column;
  }
  .editor-shell{
    grid-template-columns:1fr;
  }
  .tools{
    border-right:0;
    border-bottom:1px solid var(--line);
  }
}
</style>
</head>

<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrap">

  </a>
