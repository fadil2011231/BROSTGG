<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090b14">
<title>SkinForge — Pro Skin Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<!-- Skinview3D Library -->
<script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundle.js"></script>

<style>
:root{
  --bg: #090b14; --panel: rgba(25, 29, 43, 0.45); --line: rgba(255, 255, 255, 0.08);
  --text: #f3f4ff; --muted: #989fb9; --accent: #b6fa70; --glow: rgba(182, 250, 112, 0.3);
}
*{box-sizing:border-box}
body{ margin:0;background:var(--bg);color:var(--text); font-family:'Inter',sans-serif; overflow-x: hidden; }
#particles-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; pointer-events: none; }
.orb { position: fixed; border-radius: 50%; filter: blur(120px); z-index: -1; opacity: 0.3; pointer-events: none; }
.orb-1 { width: 400px; height: 400px; background: var(--accent); top: -10%; left: -10%; }
.orb-2 { width: 500px; height: 500px; background: #3888df; bottom: -20%; right: -10%; }

button,input{font:inherit; outline:none;} button{cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:1320px;margin:auto;padding:0 28px; position: relative;}
h1, h2, .brand, .tag { font-family: 'Bebas Neue', sans-serif; letter-spacing: 1px; }

header{
  display:flex;align-items:center;justify-content:space-between;
  height:86px;border-bottom:1px solid var(--line);
  background: rgba(9, 11, 20, 0.7); backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 100;
}
.brand{font-size:32px; letter-spacing: 2px;} .brand span{color:var(--accent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;padding:11px 20px;border:1px solid var(--line);
  background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(4px);
  border-radius:9px;color:var(--text); font-weight:600;font-size:13px;
  transition: all 0.3s;
}
.btn:hover:not(:disabled){ background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); border-color: rgba(255, 255, 255, 0.2); }
.btn.primary{ background:var(--accent);color:#192610; border-color: var(--accent); box-shadow: 0 8px 20px var(--glow); }
.btn.primary:hover{ background:#d0ffa0; }

section{padding:50px 0}
.heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:30px}
h2{font-size:42px;margin:5px 0; font-weight: 400;}
.sub{font-size:14px;color:var(--muted);line-height:1.6}

/* Custom Fetch Section */
.fetch-bar {
  display: flex; gap: 15px; background: rgba(0,0,0,0.3); padding: 20px;
  border-radius: 12px; border: 1px solid var(--line); backdrop-filter: blur(10px);
  max-width: 600px; margin-bottom: 40px;
}
.fetch-bar input {
  flex: 1; padding: 12px 18px; background: rgba(255,255,255,0.05);
  border: 1px solid var(--line); border-radius: 8px; color: #fff; font-size: 15px;
}
.fetch-bar input:focus { border-color: var(--accent); }

/* Editor Shell */
.editor-shell{
  display:grid;grid-template-columns:220px minmax(0,1fr) 280px;
  border:1px solid var(--line);border-radius:20px; background: var(--panel);
  backdrop-filter: blur(20px); box-shadow: 0 25px 50px rgba(0,0,0,0.3); overflow:hidden;
}
.tools,.preview-panel{padding:24px; background: rgba(0,0,0,0.2);}
.tools{border-right:1px solid var(--line)}
.tools h3,.preview-panel h3{font-family: 'Bebas Neue', sans-serif; font-size:20px; margin:0 0 20px; color:var(--accent); letter-spacing: 1px;}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.tool-grid .btn{padding:12px 4px;font-size:12px}
.tool-grid .active{border-color:var(--accent);color:var(--accent);background:rgba(182, 250, 112, 0.1); box-shadow: inset 0 0 10px rgba(182, 250, 112, 0.1);}
.color-row{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:13px; font-weight: 500;}
input[type=color]{width:48px;height:48px;border:0;padding:0;background:none;cursor:pointer; border-radius: 8px;}
input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
input[type=color]::-webkit-color-swatch { border: 1px solid var(--line); border-radius: 8px; }
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:24px}
.swatch{height:28px;border:1px solid rgba(255,255,255,0.15);border-radius:6px; cursor: pointer; transition: transform 0.2s;}
.swatch:hover { transform: scale(1.1); }
.tools>.btn{width:100%;margin-bottom:12px}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin:20px 0; cursor: pointer;}
.workspace{padding:24px;min-width:0; display: flex; flex-direction: column;}
.workspace-top{display:flex;justify-content:space-between;gap:12px;font:12px monospace;color:var(--muted);margin-bottom:20px}
.atlas-wrap{
  width:100%;max-width:512px;margin:auto;
  background:repeating-conic-gradient(#1e2230 0% 25%,#151824 0% 50%) 0 0/16px 16px;
  border:1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;
}
#atlas{width:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.help{font-size:12px;color:var(--muted);line-height:1.7; margin-top: auto; padding-top: 20px;}

.preview-panel{border-left:1px solid var(--line)}
.preview-stage{
  display:flex;justify-content:center;align-items:center;min-height:320px;
  border-radius:12px; background:radial-gradient(circle at center, rgba(182, 250, 112, 0.1), rgba(0,0,0,0.4) 80%);
  border: 1px solid var(--line); box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
  cursor: grab; overflow: hidden;
}
.preview-stage:active { cursor: grabbing; }
#skin-container canvas { outline: none; }

.toggle{display:flex;gap:10px;margin:20px 0 25px}
.toggle .btn{flex:1}
.preview-panel input[type=text]{width:100%;margin:12px 0 20px; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid var(--line); color: white; border-radius: 8px;}
.preview-panel>.btn{width:100%;margin-top:10px}
#notice{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%);
  background:var(--accent);color:#17230e;padding:14px 28px;
  border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,0.4);z-index:1000;
  max-width:90vw;font-size:14px;font-weight:700; transition: opacity 0.3s, transform 0.3s;
}
#notice:empty{opacity: 0; transform: translate(-50%, 20px); pointer-events: none;}

@media(max-width:1050px){
  .editor-shell{grid-template-columns:180px minmax(0,1fr)}
  .preview-panel{grid-column:1/-1;border-left:0;border-top:1px solid var(--line)}
}
@media(max-width:768px){
  .wrap{padding:0 20px} .fetch-bar { flex-direction: column; }
  .editor-shell{grid-template-columns:1fr}
  .tools{border-right:0;border-bottom:1px solid var(--line)}
}
</style>
</head>
<body>

<canvas id="particles-bg"></canvas>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrap">
<header>
  <a class="brand" href="#">SKIN<span>FORGE</span></a>
</header>

<main>
<section id="studio">
  <div class="heading">
    <div>
      <div class="tag">GET ANY PRO SKIN</div>
      <h2>Fetch & Edit</h2>
      <div class="sub">Type any Minecraft Java username to load their real skin instantly.</div>
    </div>
  </div>

  <div class="fetch-bar">
    <input type="text" id="username-input" placeholder="e.g. Dream, Technoblade, Grian...">
    <button class="btn primary" id="fetch-btn">🔍 Load Skin</button>
  </div>

  <div class="editor-shell">
    <aside class="tools">
      <h3>TOOLBOX</h3>
      <div class="tool-grid">
        <button class="btn active" data-tool="pencil" aria-pressed="true">Pencil</button>
        <button class="btn" data-tool="eraser" aria-pressed="false">Eraser</button>
        <button class="btn" data-tool="fill" aria-pressed="false">Fill</button>
        <button class="btn" data-tool="pick" aria-pressed="false">Picker</button>
      </div>
      <div class="color-row">
        <input type="color" id="color" value="#b6fa70" aria-label="Paint color">
        <span id="hex" style="font-family: monospace; text-transform: uppercase;">#b6fa70</span>
      </div>
      <div class="swatches" id="swatches"></div>
      <button class="btn" id="undo">↶ Undo</button>
      <button class="btn" id="redo">↷ Redo</button>
      <label class="check"><input type="checkbox" id="show-grid" checked> Show Pixel Grid</label>
      <button class="btn" id="import-button" style="margin-top: 10px;">↑ Import PNG</button>
      <input type="file" id="file" accept="image/png" hidden>
    </aside>

    <div class="workspace">
      <div class="workspace-top">
        <span>TEXTURE MAP · 64 × 64</span>
        <span id="coordinates" style="background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 6px;">X — / Y —</span>
      </div>
      <div class="atlas-wrap">
        <canvas id="atlas" width="512" height="512"></canvas>
      </div>
      <p class="help">Draw on the map. View it live in 3D.</p>
    </div>

    <aside class="preview-panel">
      <h3>LIVE 3D VIEW</h3>
      <div class="preview-stage" id="skin-container"></div>
      <div class="toggle">
        <button class="btn primary" id="anim-idle">Idle</button>
        <button class="btn" id="anim-walk">Walk</button>
        <button class="btn" id="anim-run">Run</button>
      </div>
      <label>Skin filename</label>
      <input id="skin-name" type="text" maxlength="60" value="Custom-Skin">
      <button class="btn primary" id="download" style="margin-bottom: 12px;">↓ Download PNG</button>
    </aside>
  </div>
</section>
</main>
</div>
<div id="notice" role="status" aria-live="polite"></div>

<script>
"use strict";

const $ = id => document.getElementById(id);
let noticeTimer;
function notify(text){
  $("notice").textContent=text; $("notice").style.opacity = "1"; $("notice").style.transform = "translate(-50%, 0)";
  clearTimeout(noticeTimer); noticeTimer=setTimeout(()=>{ $("notice").style.opacity = "0"; $("notice").style.transform = "translate(-50%, 20px)"; },3500);
}

// Editor Core Setup
const skin=document.createElement("canvas"); skin.width=64; skin.height=64;
const paint=skin.getContext("2d",{willReadFrequently:true});
const atlas=$("atlas"), ac=atlas.getContext("2d");
let tool="pencil", drawing=false, lastPoint=null, activePointer=null;
const history=[], future=[], historyLimit=40;

// 3D Viewer Setup
let viewer;
function init3D() {
  viewer = new skinview3d.SkinViewer({
    canvas: document.createElement("canvas"),
    width: 250, height: 320, skin: skin.toDataURL()
  });
  $("skin-container").appendChild(viewer.canvas);
  let control = skinview3d.createOrbitControls(viewer);
  control.enableRotate = true; control.enableZoom = true;
  viewer.animation = new skinview3d.IdleAnimation();
}

function snapshot(){ return { pixels:paint.getImageData(0,0,64,64), name:$("skin-name").value }; }
function remember(){ history.push(snapshot()); if(history.length>historyLimit)history.shift(); future.length=0; }

let renderTimeout;
function update(){
  ac.clearRect(0,0,512,512); ac.imageSmoothingEnabled=false; ac.drawImage(skin,0,0,512,512);
  if($("show-grid").checked){
    ac.strokeStyle="rgba(255,255,255,0.08)";ac.lineWidth=1; ac.beginPath();
    for(let i=0;i<=64;i++){ ac.moveTo(i*8+.5,0);ac.lineTo(i*8+.5,512); ac.moveTo(0,i*8+.5);ac.lineTo(512,i*8+.5); }
    ac.stroke();
  }
  if(viewer) { clearTimeout(renderTimeout); renderTimeout = setTimeout(() => viewer.loadSkin(skin.toDataURL()), 10); }
  $("undo").disabled=history.length===0; $("redo").disabled=future.length===0;
}

function loadIntoEditor(source,name,keepHistory){
  if(keepHistory)remember(); paint.clearRect(0,0,64,64);paint.drawImage(source,0,0);
  $("skin-name").value=name; update();
}

// Fetch Minecraft Username API (Minotar)
$("fetch-btn").onclick = () => {
  const user = $("username-input").value.trim();
  if(!user) { notify("Please enter a username!"); return; }
  
  notify("Fetching skin for " + user + "...");
  const img = new Image();
  img.crossOrigin = "Anonymous"; // Allows loading image to canvas without CORS issues
  img.src = `https://minotar.net/skin/${user}`;
  
  img.onload = () => {
    loadIntoEditor(img, user + "-Skin", true);
    notify(user + "'s skin loaded successfully!");
  };
  img.onerror = () => {
    notify("Could not find a skin for that username.");
  };
};

// UI Controls & Painting
function setAnim(type) {
  $("anim-idle").classList.remove("primary"); $("anim-walk").classList.remove("primary"); $("anim-run").classList.remove("primary");
  if(type === 'idle') { viewer.animation = new skinview3d.IdleAnimation(); $("anim-idle").classList.add("primary"); }
  if(type === 'walk') { viewer.animation = new skinview3d.WalkingAnimation(); $("anim-walk").classList.add("primary"); }
  if(type === 'run') { viewer.animation = new skinview3d.RunningAnimation(); $("anim-run").classList.add("primary"); }
}
$("anim-idle").onclick = () => setAnim('idle');
$("anim-walk").onclick = () => setAnim('walk');
$("anim-run").onclick = () => setAnim('run');

document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{
  tool=b.dataset.tool; document.querySelectorAll("[data-tool]").forEach(btn=> { btn.classList.toggle("active",btn.dataset.tool===tool); });
});
function setColor(value){$("color").value=value;$("hex").textContent=value;}
$("color").oninput=e=>setColor(e.target.value);
["#b6fa70","#ffffff","#202638","#dba77e","#684329","#4cb7ec","#b278e3","#ed6175","#f7c657","#43bca0"].forEach(color=>{
  const b=document.createElement("button"); b.className="swatch";b.style.background=color; b.onclick=()=>setColor(color);$("swatches").appendChild(b);
});
$("show-grid").onchange=update;
$("undo").onclick=()=>{ if(!history.length)return; future.push(snapshot()); const prev=history.pop(); paint.putImageData(prev.pixels,0,0); update(); };
$("redo").onclick=()=>{ if(!future.length)return; history.push(snapshot()); const nxt=future.pop(); paint.putImageData(nxt.pixels,0,0); update(); };

function flood(x,y){
  const image=paint.getImageData(0,0,64,64),d=image.data, offset=(y*64+x)*4;
  const original=Array.from(d.slice(offset,offset+4)), hex=$("color").value;
  const replacement=[parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16),255];
  if(original.every((v,i)=>v===replacement[i]))return;
  const stack=[y*64+x],visited=new Uint8Array(4096);
  while(stack.length){
    const pos=stack.pop(); if(visited[pos])continue; visited[pos]=1; const i=pos*4;
    if(!original.every((v,k)=>d[i+k]===v))continue; replacement.forEach((v,k)=>d[i+k]=v);
    const px=pos%64,py=Math.floor(pos/64);
    if(px>0)stack.push(pos-1); if(px<63)stack.push(pos+1); if(py>0)stack.push(pos-64); if(py<63)stack.push(pos+64);
  }
  paint.putImageData(image,0,0);
}

function point(event){
  const r=atlas.getBoundingClientRect();
  return [Math.max(0,Math.min(63,Math.floor((event.clientX-r.left)/r.width*64))), Math.max(0,Math.min(63,Math.floor((event.clientY-r.top)/r.height*64)))];
}
function pixel(x,y){ if(tool==="eraser")paint.clearRect(x,y,1,1); else{paint.fillStyle=$("color").value;paint.fillRect(x,y,1,1);} }
function line(a,b){
  const dx=b[0]-a[0],dy=b[1]-a[1], steps=Math.max(Math.abs(dx),Math.abs(dy));
  for(let i=0;i<=steps;i++){ const t=steps?i/steps:0; pixel(Math.round(a[0]+dx*t),Math.round(a[1]+dy*t)); }
}

atlas.addEventListener("pointerdown",event=>{
  if(event.button!==0 || drawing)return; event.preventDefault(); const p=point(event);
  if(tool==="pick"){
    const data=paint.getImageData(p[0],p[1],1,1).data; if(data[3]===0)return;
    setColor("#"+Array.from(data.slice(0,3)).map(v=>v.toString(16).padStart(2,"0")).join(""));
    document.querySelector('[data-tool="pencil"]').click(); return;
  }
  remember(); if(tool==="fill"){flood(...p);update();return;}
  drawing=true;activePointer=event.pointerId;lastPoint=p; atlas.setPointerCapture(event.pointerId); pixel(...p);update();
});
atlas.addEventListener("pointermove",event=>{
  const p=point(event); $("coordinates").textContent=`X ${p[0]} / Y ${p[1]}`;
  if(!drawing || event.pointerId!==activePointer)return; line(lastPoint,p);lastPoint=p;update();
});
function finish(event){ if(event.pointerId!==activePointer)return; drawing=false;lastPoint=null;activePointer=null; }
atlas.addEventListener("pointerup",finish); atlas.addEventListener("pointercancel",finish); atlas.addEventListener("lostpointercapture",finish);

$("download").onclick=()=>{
  skin.toBlob(blob=>{
    if(!blob) return; const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=($("skin-name").value.replace(/[^a-z0-9_-]/gi,"-")||"My-Skin")+".png";
    document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(url),15000);
  },"image/png");
};

$("import-button").onclick=()=>$("file").click();
$("file").onchange=event=>{
  const file=event.target.files[0]; event.target.value=""; if(!file)return;
  const url=URL.createObjectURL(file),image=new Image();
  image.onload=()=>{ URL.revokeObjectURL(url); loadIntoEditor(image,file.name.replace(/\.png$/i,""),true); }; image.src=url;
};

// Initial Start
init3D();
const steveImg = new Image(); steveImg.crossOrigin = "Anonymous";
steveImg.src = "https://minotar.net/skin/MHF_Steve";
steveImg.onload = () => loadIntoEditor(steveImg, "Steve", false);
</script>
</body>
</html>
