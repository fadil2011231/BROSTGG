<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>SkinForge 360 Minecraft Skin Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/skinview3d@3.0.0/bundles/skinview3d.bundle.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080b10;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

.app{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* TOP BAR */

.topbar{
    height:64px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    background:#0d1118;
    border-bottom:1px solid #202733;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:1px;
}

.logo span{
    color:#7c5cff;
}

.actions{
    display:flex;
    gap:8px;
}

button{
    border:1px solid #303847;
    background:#151b24;
    color:#fff;
    padding:9px 14px;
    border-radius:8px;
    cursor:pointer;
    font-weight:700;
}

button:hover{
    background:#202938;
}

button.primary{
    background:#7057ff;
    border-color:#7057ff;
}

button.primary:hover{
    background:#826cff;
}

/* MAIN */

.main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:320px 1fr 350px;
}

/* LEFT */

.left{
    background:#0d1118;
    border-right:1px solid #202733;
    padding:18px;
    overflow:auto;
}

.section{
    margin-bottom:20px;
}

.section-title{
    font-size:12px;
    color:#8e99aa;
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:800;
    margin-bottom:10px;
}

.tools{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.tool{
    padding:12px;
    text-align:center;
}

.tool.active{
    background:#7057ff;
    border-color:#7057ff;
}

.color-row{
    display:flex;
    align-items:center;
    gap:10px;
}

#colorPicker{
    width:55px;
    height:40px;
    padding:2px;
    border:1px solid #303847;
    background:#111;
    border-radius:7px;
}

#size{
    width:100%;
}

.swatches{
    display:grid;
    grid-template-columns:repeat(8,1fr);
    gap:5px;
    margin-top:10px;
}

.swatch{
    height:26px;
    border-radius:5px;
    border:1px solid #303847;
    cursor:pointer;
}

/* CENTER */

.center{
    position:relative;
    min-width:0;
    min-height:0;
    background:
        radial-gradient(circle at center,#202735 0%,#11161f 45%,#090c11 100%);
}

#viewer{
    width:100%;
    height:100%;
}

.hint{
    position:absolute;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(5,7,10,.82);
    border:1px solid #303847;
    padding:9px 14px;
    border-radius:8px;
    font-size:12px;
    color:#b9c2d0;
    pointer-events:none;
}

/* RIGHT */

.right{
    background:#0d1118;
    border-left:1px solid #202733;
    padding:18px;
    overflow:auto;
}

.atlas-wrap{
    width:100%;
    display:flex;
    justify-content:center;
    background:#111722;
    border:1px solid #2b3442;
    border-radius:10px;
    padding:15px;
}

#skinCanvas{
    width:256px;
    height:256px;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    cursor:crosshair;
    background:
        linear-gradient(45deg,#202733 25%,transparent 25%),
        linear-gradient(-45deg,#202733 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#202733 75%),
        linear-gradient(-45deg,transparent 75%,#202733 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0;
}

.status{
    margin-top:12px;
    padding:10px;
    background:#111722;
    border:1px solid #2b3442;
    border-radius:8px;
    font-size:12px;
    color:#9ba6b7;
}

.range-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.range-row span{
    min-width:35px;
    text-align:right;
    color:#aaa;
}

input[type="range"]{
    accent-color:#7057ff;
}

label{
    font-size:13px;
    color:#aab4c3;
}

@media(max-width:1000px){
    .main{
        grid-template-columns:260px 1fr;
    }

    .right{
        display:none;
    }
}

@media(max-width:650px){
    .main{
        grid-template-columns:1fr;
    }

    .left{
        display:none;
    }
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="logo">
        SKIN<span>FORGE</span> 360
    </div>

    <div class="actions">
        <label style="display:flex;align-items:center;gap:8px">
            <input type="file" id="fileInput" accept="image/png" hidden>
            <button onclick="document.getElementById('fileInput').click()">
                Import PNG
            </button>
        </label>

        <button onclick="undo()">Undo</button>
        <button onclick="redo()">Redo</button>

        <button class="primary" onclick="downloadSkin()">
            Download PNG
        </button>
    </div>

</header>


<div class="main">

<!-- LEFT PANEL -->

<aside class="left">

    <div class="section">

        <div class="section-title">
            Tools
        </div>

        <div class="tools">

            <button class="tool active" id="pencilBtn"
                    onclick="setTool('pencil')">
                ✏️ Pencil
            </button>

            <button class="tool" id="eraserBtn"
                    onclick="setTool('eraser')">
                🧽 Eraser
            </button>

            <button class="tool" id="fillBtn"
                    onclick="setTool('fill')">
                🪣 Fill
            </button>

            <button class="tool" id="pickerBtn"
                    onclick="setTool('picker')">
                💧 Picker
            </button>

        </div>

    </div>


    <div class="section">

        <div class="section-title">
            Color
        </div>

        <div class="color-row">

            <input type="color"
                   id="colorPicker"
                   value="#ff0000">

            <div>
                <div style="font-size:12px;color:#aaa">
                    Current Color
                </div>

                <div id="hexColor"
                     style="font-weight:800;margin-top:3px">
                    #FF0000
                </div>
            </div>

        </div>

        <div class="swatches">

            <div class="swatch" style="background:#000000"
                 onclick="chooseColor('#000000')"></div>

            <div class="swatch" style="background:#ffffff"
                 onclick="chooseColor('#ffffff')"></div>

            <div class="swatch" style="background:#ff0000"
                 onclick="chooseColor('#ff0000')"></div>

            <div class="swatch" style="background:#00ff00"
                 onclick="chooseColor('#00ff00')"></div>

            <div class="swatch" style="background:#0088ff"
                 onclick="chooseColor('#0088ff')"></div>

            <div class="swatch" style="background:#ffff00"
                 onclick="chooseColor('#ffff00')"></div>

            <div class="swatch" style="background:#ff00ff"
                 onclick="chooseColor('#ff00ff')"></div>

            <div class="swatch" style="background:#7c5cff"
                 onclick="chooseColor('#7c5cff')"></div>

        </div>

    </div>


    <div class="section">

        <div class="section-title">
            Brush Size
        </div>

        <div class="range-row">

            <input
                id="size"
                type="range"
                min="1"
                max="8"
                value="1">

            <span id="sizeValue">1</span>

        </div>

    </div>


    <div class="section">

        <div class="section-title">
            Animation
        </div>

        <div class="tools">

            <button onclick="setAnimation('idle')">
                Idle
            </button>

            <button onclick="setAnimation('walk')">
                Walk
            </button>

            <button onclick="setAnimation('run')">
                Run
            </button>

            <button onclick="setAnimation('none')">
                Stop
            </button>

        </div>

    </div>

</aside>


<!-- 3D VIEW -->

<main class="center">

    <div id="viewer"></div>

    <div class="hint">
        LEFT = Paint &nbsp; • &nbsp;
        RIGHT = 360° Rotate &nbsp; • &nbsp;
        WHEEL = Zoom
    </div>

</main>


<!-- ATLAS -->

<aside class="right">

    <div class="section-title">
        Skin Texture — 64 × 64
    </div>

    <div class="atlas-wrap">

        <canvas
            id="skinCanvas"
            width="64"
            height="64">
        </canvas>

    </div>

    <div class="status">

        <div>
            <b>Left click:</b> paint
        </div>

        <div>
            <b>Right drag:</b> rotate 360°
        </div>

        <div>
            <b>Wheel:</b> zoom
        </div>

        <div style="margin-top:7px">
            Coordinates:
            <span id="coords">0, 0</span>
        </div>

    </div>

</aside>

</div>
</div>


<script>

/* =========================================================
   BASIC VARIABLES
========================================================= */

const canvas =
    document.getElementById("skinCanvas");

const ctx =
    canvas.getContext("2d", {
        willReadFrequently:true
    });

ctx.imageSmoothingEnabled = false;


let currentTool = "pencil";

let drawing = false;

let rotating = false;

let lastPaintX = -1;
let lastPaintY = -1;

let brushSize = 1;

let history = [];

let redoStack = [];

let currentColor = "#ff0000";


/* =========================================================
   INITIAL SKIN
========================================================= */

function createBlankSkin(){

    ctx.clearRect(0,0,64,64);

    /*
       Default transparent skin.
    */

    saveHistory();

}

createBlankSkin();


/* =========================================================
   HISTORY
========================================================= */

function getCanvasData(){

    return ctx.getImageData(
        0,
        0,
        64,
        64
    );
}


function restoreCanvas(data){

    ctx.putImageData(
        data,
        0,
        0
    );

    updateTexture();

}


function saveHistory(){

    history.push(
        getCanvasData()
    );

    if(history.length > 40){

        history.shift();

    }

    redoStack = [];

}


function undo(){

    if(history.length <= 1)
        return;

    const current =
        history.pop();

    redoStack.push(current);

    restoreCanvas(
        history[history.length - 1]
    );

}


function redo(){

    if(!redoStack.length)
        return;

    const data =
        redoStack.pop();

    history.push(data);

    restoreCanvas(data);

}


/* =========================================================
   COLORS
========================================================= */

const colorPicker =
    document.getElementById("colorPicker");

const hexColor =
    document.getElementById("hexColor");


colorPicker.addEventListener(
    "input",
    e => {

        currentColor =
            e.target.value;

        hexColor.textContent =
            currentColor.toUpperCase();

    }
);


function chooseColor(color){

    currentColor = color;

    colorPicker.value = color;

    hexColor.textContent =
        color.toUpperCase();

}


/* =========================================================
   TOOLS
========================================================= */

function setTool(tool){

    currentTool = tool;

    document
        .querySelectorAll(".tool")
        .forEach(b =>
            b.classList.remove("active")
        );

    const map = {
        pencil:"pencilBtn",
        eraser:"eraserBtn",
        fill:"fillBtn",
        picker:"pickerBtn"
    };

    document
        .getElementById(map[tool])
        .classList.add("active");

}


/* =========================================================
   BRUSH
========================================================= */

const sizeInput =
    document.getElementById("size");

const sizeValue =
    document.getElementById("sizeValue");


sizeInput.addEventListener(
    "input",
    () => {

        brushSize =
            Number(sizeInput.value);

        sizeValue.textContent =
            brushSize;

    }
);


/* =========================================================
   CANVAS COORDINATES
========================================================= */

function getCanvasPosition(e){

    const rect =
        canvas.getBoundingClientRect();

    const x =
        Math.floor(
            (e.clientX - rect.left)
            / rect.width
            * 64
        );

    const y =
        Math.floor(
            (e.clientY - rect.top)
            / rect.height
            * 64
        );

    return {
        x:Math.max(0,Math.min(63,x)),
        y:Math.max(0,Math.min(63,y))
    };

}


/* =========================================================
   PAINT PIXEL
========================================================= */

function paintPixel(x,y){

    const half =
        Math.floor(brushSize / 2);

    if(currentTool === "eraser"){

        ctx.clearRect(
            x-half,
            y-half,
            brushSize,
            brushSize
        );

    }else{

        ctx.fillStyle =
            currentColor;

        ctx.fillRect(
            x-half,
            y-half,
            brushSize,
            brushSize
        );

    }

    updateTexture();

}


/* =========================================================
   LINE PAINT
========================================================= */

function paintLine(x1,y1,x2,y2){

    const dx =
        x2-x1;

    const dy =
        y2-y1;

    const distance =
        Math.max(
            Math.abs(dx),
            Math.abs(dy)
        );

    for(
        let i=0;
        i<=distance;
        i++
    ){

        const x =
            Math.round(
                x1 + dx * i / distance
            );

        const y =
            Math.round(
                y1 + dy * i / distance
            );

        paintPixel(x,y);

    }

}


/* =========================================================
   FILL
========================================================= */

function floodFill(x,y){

    const image =
        ctx.getImageData(
            0,0,64,64
        );

    const data =
        image.data;

    const index =
        (y*64+x)*4;

    const target = [

        data[index],
        data[index+1],
        data[index+2],
        data[index+3]

    ];

    const temp =
        document.createElement("canvas");

    temp.width = 64;
    temp.height = 64;

    const tctx =
        temp.getContext("2d");

    tctx.putImageData(
        image,
        0,
        0
    );

    const fillColor =
        hexToRGBA(currentColor);

    if(
        target[0] === fillColor[0] &&
        target[1] === fillColor[1] &&
        target[2] === fillColor[2] &&
        target[3] === fillColor[3]
    ){

        return;

    }

    const queue = [[x,y]];

    const visited =
        new Uint8Array(64*64);

    while(queue.length){

        const [cx,cy] =
            queue.pop();

        if(
            cx<0 ||
            cy<0 ||
            cx>=64 ||
            cy>=64
        ) continue;

        const vi =
            cy*64+cx;

        if(visited[vi])
            continue;

        const p =
            vi*4;

        if(
            data[p] !== target[0] ||
            data[p+1] !== target[1] ||
            data[p+2] !== target[2] ||
            data[p+3] !== target[3]
        ) continue;

        visited[vi] = 1;

        data[p] =
            fillColor[0];

        data[p+1] =
            fillColor[1];

        data[p+2] =
            fillColor[2];

        data[p+3] =
            fillColor[3];

        queue.push([cx+1,cy]);
        queue.push([cx-1,cy]);
        queue.push([cx,cy+1]);
        queue.push([cx,cy-1]);

    }

    ctx.putImageData(
        image,
        0,
        0
    );

    updateTexture();

}


function hexToRGBA(hex){

    return [

        parseInt(hex.slice(1,3),16),

        parseInt(hex.slice(3,5),16),

        parseInt(hex.slice(5,7),16),

        255

    ];

}


/* =========================================================
   PICKER
========================================================= */

function pickColor(x,y){

    const pixel =
        ctx.getImageData(
            x,
            y,
            1,
            1
        ).data;

    const hex =
        "#" +
        [pixel[0],pixel[1],pixel[2]]
        .map(v =>
            v.toString(16).padStart(2,"0")
        )
        .join("");

    chooseColor(hex);

    setTool("pencil");

}


/* =========================================================
   2D CANVAS MOUSE
========================================================= */

canvas.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);


canvas.addEventListener(
    "mousedown",
    e => {

        if(e.button !== 0)
            return;

        const pos =
            getCanvasPosition(e);

        if(currentTool === "picker"){

            pickColor(
                pos.x,
                pos.y
            );

            return;

        }

        saveHistory();

        if(currentTool === "fill"){

            floodFill(
                pos.x,
                pos.y
            );

            return;

        }

        drawing = true;

        lastPaintX =
            pos.x;

        lastPaintY =
            pos.y;

        paintPixel(
            pos.x,
            pos.y
        );

    }
);


canvas.addEventListener(
    "mousemove",
    e => {

        const pos =
            getCanvasPosition(e);

        document.getElementById(
            "coords"
        ).textContent =
            `${pos.x}, ${pos.y}`;

        if(!drawing)
            return;

        paintLine(
            lastPaintX,
            lastPaintY,
            pos.x,
            pos.y
        );

        lastPaintX =
            pos.x;

        lastPaintY =
            pos.y;

    }
);


window.addEventListener(
    "mouseup",
    () => {

        drawing = false;

        lastPaintX = -1;
        lastPaintY = -1;

    }
);


/* =========================================================
   SKINVIEW3D
========================================================= */

const viewerContainer =
    document.getElementById("viewer");


const viewer =
    new skinview3d.SkinViewer({

        canvas:
            document.createElement("canvas"),

        width:
            viewerContainer.clientWidth,

        height:
            viewerContainer.clientHeight,

        skin:
            null

    });


viewerContainer.appendChild(
    viewer.canvas
);


viewer.canvas.style.width = "100%";
viewer.canvas.style.height = "100%";


/* =========================================================
   TEXTURE
========================================================= */

const texture =
    viewer.playerObject.skin;


function updateTexture(){

    const image =
        canvas.toDataURL();

    const img =
        new Image();

    img.onload = () => {

        viewer.loadSkin(
            img.src
        );

    };

    img.src = image;

}


/* =========================================================
   DEFAULT CAMERA
========================================================= */

let cameraAngle = 0;

let cameraElevation = 0.15;

let cameraDistance = 3.2;

const target =
    new THREE.Vector3(
        0,
        0.8,
        0
    );


function updateCamera(){

    const camera =
        viewer.camera;

    const maxElevation =
        1.35;

    cameraElevation =
        Math.max(
            -maxElevation,
            Math.min(
                maxElevation,
                cameraElevation
            )
        );

    const horizontal =
        Math.cos(cameraElevation)
        * cameraDistance;

    camera.position.x =
        Math.sin(cameraAngle)
        * horizontal;

    camera.position.z =
        Math.cos(cameraAngle)
        * horizontal;

    camera.position.y =
        target.y +
        Math.sin(cameraElevation)
        * cameraDistance;

    camera.lookAt(target);

}


/* =========================================================
   FULL 360° MOUSE ROTATION
========================================================= */

let rotateStartX = 0;

let rotateStartY = 0;

let startAngle = 0;

let startElevation = 0;


viewer.canvas.addEventListener(
    "contextmenu",
    e => e.preventDefault()
);


viewer.canvas.addEventListener(
    "mousedown",
    e => {

        /*
           RIGHT CLICK
           = ROTATE
        */

        if(e.button === 2){

            e.preventDefault();

            rotating = true;

            rotateStartX =
                e.clientX;

            rotateStartY =
                e.clientY;

            startAngle =
                cameraAngle;

            startElevation =
                cameraElevation;

        }

        /*
           MIDDLE CLICK
           = ROTATE
        */

        if(e.button === 1){

            e.preventDefault();

            rotating = true;

            rotateStartX =
                e.clientX;

            rotateStartY =
                e.clientY;

            startAngle =
                cameraAngle;

            startElevation =
                cameraElevation;

        }

    }
);


window.addEventListener(
    "mousemove",
    e => {

        if(!rotating)
            return;

        const dx =
            e.clientX -
            rotateStartX;

        const dy =
            e.clientY -
            rotateStartY;

        /*
           Horizontal movement
           = unlimited 360° rotation
        */

        cameraAngle =
            startAngle +
            dx * 0.012;

        /*
           Vertical movement
           = looking up/down
        */

        cameraElevation =
            startElevation -
            dy * 0.008;

        updateCamera();

    }
);


window.addEventListener(
    "mouseup",
    e => {

        if(
            e.button === 2 ||
            e.button === 1
        ){

            rotating = false;

        }

    }
);


/* =========================================================
   ZOOM
========================================================= */

viewer.canvas.addEventListener(
    "wheel",
    e => {

        e.preventDefault();

        cameraDistance +=
            e.deltaY * 0.002;

        cameraDistance =
            Math.max(
                1.5,
                Math.min(
                    7,
                    cameraDistance
                )
            );

        updateCamera();

    },
    {
        passive:false
    }
);


/* =========================================================
   RAYCASTING
========================================================= */

const raycaster =
    new THREE.Raycaster();

const mouse =
    new THREE.Vector2();


function getViewerMouse(e){

    const rect =
        viewer.canvas.getBoundingClientRect();

    mouse.x =
        ((e.clientX - rect.left)
        / rect.width) * 2 - 1;

    mouse.y =
        -((e.clientY - rect.top)
        / rect.height) * 2 + 1;

}


/* =========================================================
   3D LEFT CLICK = PAINT
========================================================= */

viewer.canvas.addEventListener(
    "mousedown",
    e => {

        if(e.button !== 0)
            return;

        getViewerMouse(e);

        raycaster.setFromCamera(
            mouse,
            viewer.camera
        );

        const objects = [];

        viewer.playerObject.traverse(
            obj => {

                if(obj.isMesh){

                    objects.push(obj);

                }

            }
        );

        const hits =
            raycaster.intersectObjects(
                objects,
                true
            );

        if(!hits.length)
            return;

        const hit =
            hits[0];

        if(!hit.uv)
            return;

        /*
           THREE UV coordinates have their
           vertical direction opposite to
           the 64x64 canvas.

           THIS IS THE IMPORTANT FIX.
        */

        let px =
            Math.floor(
                hit.uv.x * 64
            );

        let py =
            Math.floor(
                (1 - hit.uv.y) * 64
            );

        px =
            Math.max(
                0,
                Math.min(
                    63,
                    px
                )
            );

        py =
            Math.max(
                0,
                Math.min(
                    63,
                    py
                )
            );

        if(currentTool === "picker"){

            pickColor(
                px,
                py
            );

            return;

        }

        saveHistory();

        if(currentTool === "fill"){

            floodFill(
                px,
                py
            );

            return;

        }

        paintPixel(
            px,
            py
        );

    }
);


/* =========================================================
   IMPORT PNG
========================================================= */

document.getElementById(
    "fileInput"
).addEventListener(
    "change",
    e => {

        const file =
            e.target.files[0];

        if(!file)
            return;

        const img =
            new Image();

        img.onload = () => {

            saveHistory();

            ctx.clearRect(
                0,
                0,
                64,
                64
            );

            ctx.drawImage(
                img,
                0,
                0,
                64,
                64
            );

            updateTexture();

        };

        img.src =
            URL.createObjectURL(file);

    }
);


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadSkin(){

    const link =
        document.createElement("a");

    link.download =
        "minecraft-skin.png";

    link.href =
        canvas.toDataURL(
            "image/png"
        );

    link.click();

}


/* =========================================================
   ANIMATION
========================================================= */

let currentAnimation = null;


function setAnimation(type){

    if(currentAnimation){

        currentAnimation =
            null;

    }

    if(type === "idle"){

        currentAnimation =
            new skinview3d.IdleAnimation();

    }

    if(type === "walk"){

        currentAnimation =
            new skinview3d.WalkingAnimation();

    }

    if(type === "run"){

        currentAnimation =
            new skinview3d.RunningAnimation();

    }

    if(type === "none"){

        viewer.animation = null;

        return;

    }

    viewer.animation =
        currentAnimation;

}


/* =========================================================
   RESIZE
========================================================= */

function resizeViewer(){

    const width =
        viewerContainer.clientWidth;

    const height =
        viewerContainer.clientHeight;

    viewer.width =
        width;

    viewer.height =
        height;

    viewer.resize(
        width,
        height
    );

    updateCamera();

}


window.addEventListener(
    "resize",
    resizeViewer
);


/* =========================================================
   INITIALIZE
========================================================= */

viewer.fov = 45;

viewer.zoom = 1;

viewer.autoRotate = false;

/*
   Disable skinview3d's default mouse controls.
   We use our own controls so LEFT can remain
   dedicated to painting.
*/

if(viewer.controls){

    viewer.controls.enableRotate = false;

    viewer.controls.enableZoom = false;

    viewer.controls.enablePan = false;

}


updateCamera();

resizeViewer();

updateTexture();


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if(e.ctrlKey && e.key.toLowerCase() === "z"){

            e.preventDefault();

            undo();

        }

        if(
            e.ctrlKey &&
            e.key.toLowerCase() === "y"
        ){

            e.preventDefault();

            redo();

        }

        if(e.key === "e"){

            setTool("eraser");

        }

        if(e.key === "p"){

            setTool("pencil");

        }

    }
);

</script>
